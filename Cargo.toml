[workspace]
members = ["source/forge/core", "source/forge/skeleton", "source/forge/checks", "source/forge/workflow", "source/forge/factory", "source/forge/lifecycle", "source/forge/memory", "source/forge/cli", "source/forge/hook", "source/orchestrator/tasks", "source/orchestrator/storage", "source/orchestrator/execution", "source/orchestrator/transfer", "source/orchestrator/install", "source/orchestrator/cli"]
exclude = [".codex/hooks", "scripts/tests"]
default-members = ["source/forge/cli", "source/forge/hook", "source/forge/factory"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.metadata.bridgeforge]
factory-members = ["source/forge/core", "source/forge/skeleton", "source/forge/checks", "source/forge/workflow", "source/forge/lifecycle", "source/forge/memory", "source/forge/factory", "source/forge/cli", "source/forge/hook"]
public-members = ["source/forge/core", "source/forge/skeleton", "source/forge/checks", "source/forge/workflow", "source/forge/lifecycle", "source/forge/memory", "source/forge/cli", "source/forge/hook"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2"

bridgeforge-core = { path = "source/forge/core" }
bridgeforge-skeleton = { path = "source/forge/skeleton" }
bridgeforge-checks = { path = "source/forge/checks" }
bridgeforge-workflow = { path = "source/forge/workflow" }
bridgeforge-factory = { path = "source/forge/factory" }
bridgeforge-lifecycle = { path = "source/forge/lifecycle" }
bridgeforge-memory = { path = "source/forge/memory" }
bridgeforge-cli = { path = "source/forge/cli" }
bridgeforge-hook = { path = "source/forge/hook" }
toml_edit = "=0.23.7"
pep440_rs = "=0.7.3"
pep508_rs = "=0.9.2"
syn = { version = "=2.0.119", features = ["full", "visit"] }

bridgepilot-tasks = { path = "source/orchestrator/tasks" }
bridgepilot-storage = { path = "source/orchestrator/storage" }
bridgepilot-execution = { path = "source/orchestrator/execution" }
bridgepilot-transfer = { path = "source/orchestrator/transfer" }
bridgepilot-install = { path = "source/orchestrator/install" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
