[package]
name = "bridgepilot-orchestrator"
version = "0.16.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "bp"
path = "main.rs"

[[bin]]
name = "bp-launcher"
path = "launcher.rs"
test = false

[dependencies]
bridgeforge-core.workspace = true
bridgepilot-tasks.workspace = true
bridgepilot-storage.workspace = true
bridgepilot-execution.workspace = true
bridgepilot-transfer.workspace = true
bridgepilot-install.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[features]
test-fixtures = ["bridgepilot-install/test-fixtures", "bridgepilot-transfer/test-fixtures"]

[[bin]]
name = "bp-rpc-fixture"
path = "../../../scripts/tests/orchestrator/rpc_fixture.rs"
required-features = ["test-fixtures"]
test = false

[[test]]
name = "orchestration"
path = "../../../scripts/tests/orchestrator/execute.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
rusqlite = { version = "=0.38.0", features = ["bundled", "backup", "serialize"] }
