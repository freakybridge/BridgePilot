[package]
name = "bridgeforge-factory-tests"
version = "6.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
bridgeforge-core = { path = "../../source/forge/core" }
bridgeforge-skeleton = { path = "../../source/forge/skeleton" }
bridgeforge-lifecycle = { path = "../../source/forge/lifecycle" }
bridgeforge-workflow = { path = "../../source/forge/workflow" }
bridgeforge-memory = { path = "../../source/forge/memory" }
bridgeforge-checks = { path = "../../source/forge/checks" }
bridgeforge-factory = { path = "../../source/forge/factory" }
bridgeforge-hook = { path = "../../source/forge/hook" }
serde_json = "1.0"
sha2 = "0.10"

[workspace]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
